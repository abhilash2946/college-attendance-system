{% extends "base.html" %}
{% block content %}

<div class="login-shell">
  <div class="login-card">

    <div class="login-brand">
      <div class="login-icon">
        <i class="bi bi-mortarboard-fill"></i>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to the Attendance Management System</p>
    </div>

    <form method="post" class="login-form">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <i class="bi bi-person"></i>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock"></i>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="login-btn">
        Sign In &nbsp;<i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="login-footer">
      <strong>Demo credentials:</strong>&nbsp;
      <code>faculty</code> / <code>password</code>
    </div>

  </div>
</div>

{% endblock %}
